version: v2
clean: true
plugins:
  - local: ["go", "tool", "-modfile=tools/go.mod", "protoc-gen-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: ["go", "tool", "-modfile=tools/go.mod", "protoc-gen-connect-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: node_modules/.bin/protoc-gen-es
    out: admin/src/gen
    opt: target=ts
  - local: node_modules/.bin/protoc-gen-es
    out: e2e/src/gen
    opt: target=ts
